<!DOCTYPE html>
<link rel="stylesheet" href="css/style.css">
<nav>
  <span class="logo">暁秀祭2026</span>
</nav>

<div style="max-width: 800px; margin: 2rem auto; padding: 0 2rem;">
  <a class="back-link" href="index.html">&larr; Back to home</a>
</div>

<section id="timetable">
  <h2>タイムテーブル</h2>
  <div class="timetable-wrapper">

    <div class="timetable-header-row">
      <div class="timetable-header timetable-header-left">メインステージ<span class="timetable-sub">（体育館）</span></div>
      <div class="timetable-center-header"></div>
      <div class="timetable-header timetable-header-right">サブステージ<span class="timetable-sub">（中庭）</span></div>
    </div>

    <div class="timetable-body" id="timetableBody"></div>

  </div>
</section>

<script>
const mainSlots = {
  "8:40":  { label: "入場開始",             span: 1,  desc: "会場への入場を開始します。指定の席へお進みください。" },
  "8:50":  { label: "オープニング",         span: 4,  desc: "暁秀祭のオープニングプログラムです。生徒会による進行でお届けします。" },
  "9:30":  { label: "GWO",                 span: 3,  desc: "吹奏楽部曲目", img: "img/suibu.jpg" },
  "10:10": { label: "中学生合唱",           span: 10, desc: "中学生による合唱コンクール" },
  "12:30": { label: "箏曲部演奏",           span: 4,  desc: "箏曲部による和楽器演奏です。日本の伝統音楽をお楽しみください。" },
  "13:10": { label: "GGT前半",             span: 4,  desc: "Great Got Talentの前半戦です。生徒によるパフォーマンスをお楽しみください。" },
  "13:50": { label: "中学生：暁秀王決勝",   span: 3,  desc: "中学生部門の暁秀王決勝戦です。予選を勝ち抜いた代表が競います。" },
  "14:20": { label: "高校生：暁秀王決勝",   span: 3,  desc: "高校生部門の暁秀王決勝戦です。最高のパフォーマンスをご覧ください。" },
  "14:50": { label: "暁秀王表彰式",         span: 1,  desc: "暁秀王の表彰式を行います。優勝者の発表をお楽しみに！" },
  "15:00": { label: "中学合唱成績発表",     span: 1,  desc: "中学生合唱コンクールの成績を発表します。" },
  "15:10": { label: "GGT後半",             span: 3,  desc: "Gyoshu Got Talentの後半戦" },
  "15:40": { label: "エンディング",         span: 4,  desc: "暁秀祭文化の部エンディングセレモニー"},
};

const subSlots = {
  "9:30":  { label: "中学生：暁秀王予選",  span: 4, desc: "中学生部門の暁秀王予選です。各クラスの代表が熱いパフォーマンスを披露します。" },
  "11:20": { label: "高校生：暁秀王予選",  span: 4, desc: "高校生部門の暁秀王予選です。個性あふれるパフォーマンスをお楽しみください。" },
  "12:30": { label: "GWO",                span: 5, desc: "吹奏楽部曲目" },
  "13:30": { label: "中央廊下：合唱部",    span: 6, desc: "合唱部が中央廊下で歌います。校舎に響く歌声をお楽しみください。" },
};

const ROW_HEIGHT = 32;

function generateTimes() {
  const times = [];
  let h = 8, m = 40;
  while (h < 16 || (h === 16 && m <= 10)) {
    times.push(`${h}:${m.toString().padStart(2, '0')}`);
    m += 10;
    if (m >= 60) { m -= 60; h++; }
  }
  return times;
}

function buildTimetable() {
  const times = generateTimes();
  const body = document.getElementById('timetableBody');

  times.forEach(time => {
    const row = document.createElement('div');
    row.className = 'tt-row';

    const mainDiv = document.createElement('div');
    mainDiv.className = 'tt-main';

    const centerDiv = document.createElement('div');
    centerDiv.className = 'tt-center';
    centerDiv.innerHTML = `<div class="tt-time">${time}</div><div class="tt-line"></div>`;

    const subDiv = document.createElement('div');
    subDiv.className = 'tt-sub';

    if (mainSlots[time]) {
      const prog = document.createElement('div');
      prog.className = 'tt-program tt-program-left';
      prog.style.height = (mainSlots[time].span * ROW_HEIGHT) + 'px';
      prog.innerHTML = `
        ${mainSlots[time].label}
        <div class="tt-tooltip tt-tooltip-left">
          ${mainSlots[time].img ? `<img src="${mainSlots[time].img}" class="tt-tooltip-img">` : ''}
          <div class="tt-tooltip-title">${mainSlots[time].label}</div>
          <div class="tt-tooltip-desc">${mainSlots[time].desc}</div>
        </div>
      `;
      mainDiv.appendChild(prog);
    }

    if (subSlots[time]) {
      const prog = document.createElement('div');
      prog.className = 'tt-program tt-program-right';
      prog.style.height = (subSlots[time].span * ROW_HEIGHT) + 'px';
      prog.innerHTML = `
        ${subSlots[time].label}
        <div class="tt-tooltip tt-tooltip-right">
          <div class="tt-tooltip-title">${subSlots[time].label}</div>
          <div class="tt-tooltip-desc">${subSlots[time].desc}</div>
        </div>
      `;
      subDiv.appendChild(prog);
    }

    row.appendChild(mainDiv);
    row.appendChild(centerDiv);
    row.appendChild(subDiv);
    body.appendChild(row);
  });
}

buildTimetable();
</script>

<section>
  <h2 style="margin-top: 2rem;">在校生へ</h2>
  <p style="font-size: 14px; color: #555; line-height: 1.8;">募集要項</p>
</section>

</body>
</html>
